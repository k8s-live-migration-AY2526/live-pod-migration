---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: podmigrations.lpm.my.domain
spec:
  group: lpm.my.domain
  names:
    kind: PodMigration
    listKind: PodMigrationList
    plural: podmigrations
    singular: podmigration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Name of the Pod to migrate
      jsonPath: .spec.podName
      name: Pod Name
      type: string
    - description: Target node for restore
      jsonPath: .spec.targetNode
      name: Target Node
      type: string
    - description: Current lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: PodMigration is the Schema for the podmigrations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodMigrationSpec defines the desired state of PodMigration.
            properties:
              closeTcp:
                description: When set to true, will checkpoint and close tcp connections
                type: boolean
              deferTermination:
                description: When set to true, will defer termination to after restored
                type: boolean
              podName:
                description: Name of the Pod to migrate (required).
                type: string
              retainOriginalPod:
                default: false
                description: |-
                  RetainOriginalPod indicates whether to keep the original Pod after migration.
                  By default, the original Pod will be deleted after successful migration.
                  For StatefulSet pods, the original pod will be deleted regardless of this flag
                  to enable recreation by the StatefulSet controller.
                type: boolean
              targetNode:
                description: TargetNode is the name of the node where the Pod should
                  be restored.
                type: string
            required:
            - podName
            type: object
          status:
            description: PodMigrationStatus defines the observed state of PodMigration.
            properties:
              checkpointImages:
                additionalProperties:
                  type: string
                description: CheckpointImages maps container names to their prepared
                  OCI checkpoint image references.
                type: object
              ephemeralPullPodName:
                description: EphemeralPullPodName is the name of the ephemeral pod
                  used to pull images.
                type: string
              isDeployment:
                description: |-
                  IsDeployment indicates whether this migration involves a pod managed by a Deployment.
                  This field is automatically set by the controller when it detects that
                  the source pod is owned by a ReplicaSet controller which implies it's managed by a Deployment.
                type: boolean
              isStatefulSet:
                description: |-
                  IsStatefulSet indicates whether this migration involves a StatefulSet pod.
                  This field is automatically set by the controller when it detects that
                  the source pod is owned by a StatefulSet controller.
                type: boolean
              message:
                description: |-
                  Message is a human-readable summary of the most recent state transition
                  or error.
                type: string
              phase:
                description: Phase is the high-level lifecycle marker.
                type: string
              podCheckpointRef:
                description: PodCheckpointRef lets PodMigration track the checkpoint
                  it spawned/bound.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              restoredPodName:
                description: RestoredPodName is the name of the restored pod after
                  migration.
                type: string
            type: object
