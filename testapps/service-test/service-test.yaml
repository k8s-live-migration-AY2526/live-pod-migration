apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Pod
metadata:
  name: client-pod
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["/bin/sh","-c"]
      args:
        - while true; do
            if curl -sSf http://nginx-svc:80 >/dev/null; then
              echo $(date -Iseconds) OK;
            else
              echo $(date -Iseconds) FAIL;
            fi;
            sleep 1;
          done