apiVersion: v1
kind: Pod
metadata:
  name: nginx-nodeport
  labels:
    app: nginx-nodeport  
spec:
  nodeName: k8s-worker
  containers:
  - name: nginx
    image: nginx:1.25
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-svc
spec:
  type: NodePort
  selector:
    app: nginx-nodeport
  ports:
  - port: 80          # service port
    targetPort: 80    # pod containerPort
    nodePort: 30080   # fixed NodePort (range 30000–32767)
