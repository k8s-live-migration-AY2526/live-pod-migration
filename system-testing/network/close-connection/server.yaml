apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  clusterIP: 10.96.1.1 
  ports:
  - port: 6379
    name: redis
  selector:
    app: redis-server
---
apiVersion: v1
kind: Pod
metadata:
  name: redis-server
  labels:
    app: redis-server
spec:
  nodeName: k8s-worker
  containers:
  - name: redis
    image: redis:6.0-alpine
    ports:
    - containerPort: 6379
      name: redis
    volumeMounts:
    - name: redis-data
      mountPath: /data
  volumes:
  - name: redis-data
    emptyDir: {}