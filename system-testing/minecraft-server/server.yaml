apiVersion: v1
kind: ConfigMap
metadata:
  name: luanti-heavy-config
data:
  minetest.conf: |
    default_privs = interact, shout, privilege, server, settime, fly, noclip, teleporter
    
    # --- RAM HOARDING SETTINGS ---
    # Keep chunks in RAM even if players leave the area
    # server_unload_unused_data = false
    # Do not save to disk for 1 hour (Forces state to stay in RAM)
    server_map_save_interval = 600
    
    # --- GENERATION SETTINGS ---
    # Keep a wider area around the player active (more RAM usage)
    active_block_range = 3
    # Allow generating chunks further away
    max_block_generate_distance = 8
    
    # --- NETWORK & GAME ---
    bind_address = 0.0.0.0
    port = 30000
    default_game = devtest
    server_name = MigrationTest
    enable_ipv6 = false

---

apiVersion: v1
kind: Service
metadata:
  name: luanti-service
spec:
  type: NodePort
  selector:
    app: luanti-set
  ports:
    - protocol: UDP
      port: 30000
      targetPort: 30000
      nodePort: 30000

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: luanti-set
spec:
  serviceName: "luanti-service"
  replicas: 1
  selector:
    matchLabels:
      app: luanti-set
  template:
    metadata:
      labels:
        app: luanti-set
    spec:
      containers:
      - name: luanti
        image: lscr.io/linuxserver/luanti:latest
        
        ports:
        - containerPort: 30000
          protocol: UDP
        
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        # FIX: Point to the config file instead of using --set
        - name: CLI_ARGS
          value: "--config /config/minetest.conf"

        volumeMounts:
        # 1. Mount the NFS Storage
        - name: data
          mountPath: /config
        # 2. Inject the ConfigMap into the NFS mount
        - name: config-volume
          mountPath: /config/minetest.conf
          subPath: minetest.conf

      volumes:
      - name: config-volume
        configMap:
          name: luanti-heavy-config

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteMany" ]
      storageClassName: "nfs-csi"
      resources:
        requests:
          storage: 1Gi